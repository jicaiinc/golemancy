# Build Golemancy for macOS without creating a release.
#
# Trigger: manual (Actions → Build macOS → Run workflow)
#
# Artifacts are available for download from the workflow run page for 7 days.
# Cost estimate: ~10 min × 10x macOS multiplier = ~100 minutes per run.

name: Build macOS

on:
  workflow_dispatch:

# Prevent concurrent builds
concurrency:
  group: build-mac
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    name: Build (mac-arm64)

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download runtimes
        run: bash scripts/download-runtime.sh --arch arm64 --force
        shell: bash

      - name: Build (electron-vite)
        run: pnpm --filter @golemancy/desktop build

      - name: Bundle server
        run: node scripts/bundle-server.mjs --arch arm64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Preflight check
        run: node scripts/preflight-check.mjs --target mac

      - name: Smoke test (bundled server)
        shell: bash
        run: |
          BUNDLED_NODE="apps/desktop/resources/runtime/node/bin/node"

          if [[ ! -x "$BUNDLED_NODE" ]]; then
            echo "ERROR: Bundled Node.js not found at $BUNDLED_NODE"
            exit 1
          fi

          node -e "
            const { fork } = require('child_process');
            const child = fork('apps/desktop/resources/server/deps/index.js', [], {
              execPath: '$BUNDLED_NODE',
              env: { ...process.env, PORT: '0', NODE_ENV: 'production' },
              stdio: ['pipe', 'pipe', 'pipe', 'ipc'],
            });

            child.stdout.on('data', (d) => process.stdout.write(d));
            child.stderr.on('data', (d) => process.stderr.write(d));

            const timeout = setTimeout(() => {
              console.error('ERROR: Server did not send ready message within 60 seconds');
              child.kill();
              process.exit(1);
            }, 60000);

            child.on('message', (msg) => {
              if (msg && msg.type === 'ready') {
                console.log('Smoke test PASSED — server started on port ' + msg.port);
                clearTimeout(timeout);
                child.kill();
                process.exit(0);
              }
            });

            child.on('error', (err) => {
              console.error('ERROR: Server fork failed:', err.message);
              clearTimeout(timeout);
              process.exit(1);
            });

            child.on('exit', (code) => {
              if (code !== null && code !== 0) {
                console.error('ERROR: Server exited with code ' + code);
                clearTimeout(timeout);
                process.exit(1);
              }
            });
          "

      - name: Install Apple intermediate certificate
        run: |
          curl -sO https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
          sudo security import DeveloperIDG2CA.cer -k /Library/Keychains/System.keychain -T /usr/bin/codesign
          echo "✓ Apple Developer ID G2 intermediate certificate installed"

      - name: Verify signing credentials
        run: |
          echo "CSC_LINK length: ${#CSC_LINK}"
          echo "CSC_KEY_PASSWORD set: $([ -n "$CSC_KEY_PASSWORD" ] && echo 'yes' || echo 'NO')"
          echo "APPLE_ID set: $([ -n "$APPLE_ID" ] && echo 'yes' || echo 'NO')"
          echo "APPLE_TEAM_ID: $APPLE_TEAM_ID"
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: NDX2ZZ8U2R

      - name: Package (electron-builder)
        run: |
          cd apps/desktop
          npx electron-builder --mac --arm64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: NDX2ZZ8U2R
          DEBUG: electron-builder,electron-osx-sign*

      - name: Verify DMG integrity
        run: |
          for dmg in apps/desktop/release/*.dmg; do
            echo "Verifying: $dmg"
            hdiutil verify "$dmg"
            echo "✓ $(basename "$dmg") is valid"
          done

      - name: Verify code signature
        run: |
          DMG=$(ls apps/desktop/release/*.dmg | head -1)
          echo "Mounting: $DMG"
          MOUNT_DIR=$(hdiutil attach "$DMG" -nobrowse -mountpoint /tmp/golemancy-verify | tail -1 | awk '{print $NF}')
          APP=$(find /tmp/golemancy-verify -name "*.app" -maxdepth 1 | head -1)
          echo "Verifying: $APP"
          codesign --verify --deep --strict "$APP"
          echo "✓ Code signature valid"
          spctl -a -t exec -vvv "$APP"
          echo "✓ Gatekeeper assessment passed"
          hdiutil detach /tmp/golemancy-verify
          xcrun stapler validate "$DMG"
          echo "✓ Stapler validation passed"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: golemancy-mac-arm64
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
          if-no-files-found: error
          retention-days: 7
