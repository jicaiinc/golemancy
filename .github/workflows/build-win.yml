# Build Golemancy for Windows without creating a release.
#
# Trigger: manual (Actions → Build Windows → Run workflow)
#
# Artifacts are available for download from the workflow run page for 7 days.
# Cost estimate: ~10 min × 2x Windows multiplier = ~20 minutes per run.

name: Build Windows

on:
  workflow_dispatch:

# Prevent concurrent builds
concurrency:
  group: build-win
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    name: Build (win-x64)

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download runtimes
        run: bash scripts/download-runtime.sh --arch x64 --force
        shell: bash

      - name: Build (electron-vite)
        run: pnpm --filter @golemancy/desktop build

      - name: Bundle server
        run: node scripts/bundle-server.mjs --arch x64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Preflight check
        run: node scripts/preflight-check.mjs --target win

      - name: Smoke test (bundled server)
        shell: bash
        run: |
          BUNDLED_NODE="apps/desktop/resources/runtime/node/node.exe"

          if [[ ! -x "$BUNDLED_NODE" ]]; then
            echo "ERROR: Bundled Node.js not found at $BUNDLED_NODE"
            exit 1
          fi

          node -e "
            const { fork } = require('child_process');
            const child = fork('apps/desktop/resources/server/deps/index.js', [], {
              execPath: '$BUNDLED_NODE',
              env: { ...process.env, PORT: '0', NODE_ENV: 'production' },
              stdio: ['pipe', 'pipe', 'pipe', 'ipc'],
            });

            child.stdout.on('data', (d) => process.stdout.write(d));
            child.stderr.on('data', (d) => process.stderr.write(d));

            const timeout = setTimeout(() => {
              console.error('ERROR: Server did not send ready message within 60 seconds');
              child.kill();
              process.exit(1);
            }, 60000);

            child.on('message', (msg) => {
              if (msg && msg.type === 'ready') {
                console.log('Smoke test PASSED — server started on port ' + msg.port);
                clearTimeout(timeout);
                child.kill();
                process.exit(0);
              }
            });

            child.on('error', (err) => {
              console.error('ERROR: Server fork failed:', err.message);
              clearTimeout(timeout);
              process.exit(1);
            });

            child.on('exit', (code) => {
              if (code !== null && code !== 0) {
                console.error('ERROR: Server exited with code ' + code);
                clearTimeout(timeout);
                process.exit(1);
              }
            });
          "

      # No code signing — Azure Trusted Signing secrets may not be configured.
      # Add AZURE_* env vars here if you want signed builds.
      - name: Package (electron-builder)
        run: |
          cd apps/desktop
          npx electron-builder --win --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Verify Windows packages
        shell: pwsh
        run: |
          $files = Get-ChildItem "apps/desktop/release" -File | Where-Object { $_.Extension -in '.exe','.msi' }
          if ($files.Count -eq 0) {
            Write-Error "ERROR: No .exe or .msi installer files found in apps/desktop/release/"
            exit 1
          }
          foreach ($file in $files) {
            $sizeMB = [math]::Round($file.Length / 1MB, 1)
            if ($sizeMB -lt 50) {
              Write-Error "ERROR: $($file.Name) is suspiciously small ($sizeMB MB) — expected >50 MB for a full Electron app"
              exit 1
            }
            Write-Host "✓ $($file.Name) — $sizeMB MB"
          }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: golemancy-win-x64
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.msi
          if-no-files-found: error
          retention-days: 7
