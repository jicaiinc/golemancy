[package]
name = "golemancy-desktop"
version = "0.2.0"
description = "Golemancy desktop client"
authors = ["Golemancy"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "golemancy_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.3", features = [] }

[dependencies]
hex = "0.4.3"
rand = "0.9.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tauri = { version = "2.9.5", features = [] }
